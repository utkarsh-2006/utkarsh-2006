<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350">
  <defs>
    <pattern id="arch-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="#D4D9E2"/>
    </pattern>
  </defs>

  <rect width="880" height="350" fill="#FAF9F6"/>
  <rect width="880" height="350" fill="url(#arch-dots)"/>

  <g transform="translate(45, 30)">
    <text x="0" y="0" font-family="system-ui, sans-serif" font-size="9" fill="#306FE5" font-weight="700" letter-spacing="3">SYSTEM PARADIGM // NARRATIVE PIPELINE</text>
    <text x="0" y="20" font-family="system-ui, sans-serif" font-size="18" fill="#10233F" font-weight="700" letter-spacing="-0.3">From Fragmented Artifacts to Auditable Truth</text>
    <line x1="0" y1="32" x2="790" y2="32" stroke="#D4D9E2" stroke-width="1"/>
  </g>

  <g transform="translate(45, 75)">
    <rect x="0" y="0" width="185" height="240" fill="#FFFFFF" stroke="#D4D9E2" stroke-width="1"/>
    <rect x="0" y="0" width="185" height="3" fill="#10233F"/>
    
    <text x="14" y="24" font-family="monospace" font-size="9" fill="#10233F" font-weight="700" letter-spacing="1.5">01 // UNDERSTAND</text>
    <text x="14" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#10233F" font-weight="700">Multimodal Extraction</text>
    
    <rect x="14" y="48" width="81.6" height="14" fill="#F0F2F5" rx="1"/>
    <text x="20" y="58" font-family="monospace" font-size="6.5" fill="#10233F" font-weight="600" letter-spacing="0.5">AI INGESTION</text>

    <!-- Custom Stage Micro-Diagram -->
    <g transform="translate(14, 72)">
      <rect x="0" y="0" width="157" height="55" fill="#FAF9F6" stroke="#D4D9E2" stroke-width="0.8"/>

        <rect x="15" y="10" width="22" height="32" fill="#FFFFFF" stroke="#10233F" stroke-width="1"/>
        <line x1="20" y1="18" x2="31" y2="18" stroke="#657187" stroke-width="1"/>
        <line x1="20" y1="24" x2="31" y2="24" stroke="#657187" stroke-width="1"/>
        <line x1="20" y1="30" x2="27" y2="30" stroke="#657187" stroke-width="1"/>
        
        <line x1="45" y1="25" x2="70" y2="25" stroke="#306FE5" stroke-width="1.2" stroke-dasharray="2,2"/>
        <polygon points="70,25 65,22 65,28" fill="#306FE5"/>
        
        <circle cx="95" cy="18" r="3" fill="#10233F"/>
        <circle cx="115" cy="30" r="3" fill="#306FE5"/>
        <circle cx="95" cy="38" r="2.5" fill="#657187"/>
        <line x1="95" y1="18" x2="115" y2="30" stroke="#D4D9E2" stroke-width="1"/>
        <line x1="95" y1="38" x2="115" y2="30" stroke="#D4D9E2" stroke-width="1"/>

    </g>

    <!-- Narrative Description Text -->
    <text x="14" y="145" font-family="system-ui, sans-serif" font-size="9" fill="#10233F">
      <tspan x="14" dy="0">Drawings (PDF/CAD), BIM/IFC models,</tspan>
      <tspan x="14" dy="13">contracts, and codes parsed in native</tspan>
      <tspan x="14" dy="13">formats. AI vision &amp; OCR extract entities,</tspan>
      <tspan x="14" dy="13">geometry and structured tables.</tspan>
    </text>

    <line x1="14" y1="210" x2="171" y2="210" stroke="#D4D9E2" stroke-width="0.6"/>
