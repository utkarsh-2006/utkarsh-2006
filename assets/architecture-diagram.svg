        <rect x="18" y="10" width="115" height="35" fill="#FFFFFF" stroke="#D4D9E2" stroke-width="1"/>
        <rect x="24" y="16" width="35" height="6" fill="#EBF2FC"/>
        <rect x="24" y="25" width="55" height="4" fill="#F0F2F5"/>
        <rect x="24" y="32" width="40" height="4" fill="#F0F2F5"/>
        <circle cx="112" cy="27" r="10" fill="none" stroke="#306FE5" stroke-width="1.2"/>
        <path d="M 108 27 L 111 30 L 117 23" fill="none" stroke="#306FE5" stroke-width="1.5"/>

    </g>

    <!-- Narrative Description Text -->
    <text x="14" y="145" font-family="system-ui, sans-serif" font-size="9" fill="#10233F">
      <tspan x="14" dy="0">Flags delivered with full source</tspan>
      <tspan x="14" dy="13">citations, geometric proof &amp; rationale.</tspan>
      <tspan x="14" dy="13">Engineers confirm or reject findings;</tspan>
      <tspan x="14" dy="13">actions trigger recursive reanalysis.</tspan>
    </text>

    <line x1="14" y1="210" x2="171" y2="210" stroke="#D4D9E2" stroke-width="0.6"/>
    <text x="14" y="226" font-family="monospace" font-size="7.5" fill="#657187">Review UI / Three.js</text>
  </g>

  <line x1="45" y1="335" x2="835" y2="335" stroke="#D4D9E2" stroke-width="1"/>
