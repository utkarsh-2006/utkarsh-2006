    <text x="20" y="58" font-family="monospace" font-size="6.5" fill="#306FE5" font-weight="600" letter-spacing="0.5">PROVENANCE AUDIT</text>

    <!-- Custom Stage Micro-Diagram -->
    <g transform="translate(14, 72)">
