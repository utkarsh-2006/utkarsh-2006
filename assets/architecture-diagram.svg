        <polygon points="45,46 95,46 95,22 45,22" fill="#EBF2FC" fill-opacity="0.4" stroke="#306FE5" stroke-width="1"/>
        <rect x="45" y="22" width="30" height="16" fill="none" stroke="#306FE5" stroke-width="1.2" stroke-dasharray="1.5,1.5"/>
        <text x="105" y="32" font-family="monospace" font-size="7" fill="#10233F" font-weight="700">CLASH!</text>
        <line x1="95" y1="30" x2="103" y2="30" stroke="#10233F" stroke-width="0.8"/>

    </g>

    <!-- Narrative Description Text -->
    <text x="14" y="145" font-family="system-ui, sans-serif" font-size="9" fill="#10233F">
      <tspan x="14" dy="0">Revisions traverse dependency edges.</tspan>
      <tspan x="14" dy="13">Deterministic geometric solvers &amp;</tspan>
      <tspan x="14" dy="13">rule engines test impacted code</tspan>
      <tspan x="14" dy="13">requirements and spatial boundaries.</tspan>
    </text>

    <line x1="14" y1="210" x2="171" y2="210" stroke="#D4D9E2" stroke-width="0.6"/>
    <text x="14" y="226" font-family="monospace" font-size="7.5" fill="#657187">NumPy / SciPy / Solvers</text>
  </g>

  <g transform="translate(633, 190)">
    <line x1="0" y1="0" x2="8" y2="0" stroke="#306FE5" stroke-width="1.5"/>
    <polygon points="8,0 4,-3 4,3" fill="#306FE5"/>
  </g>
  <g transform="translate(645, 75)">
    <rect x="0" y="0" width="185" height="240" fill="#FFFFFF" stroke="#D4D9E2" stroke-width="1"/>
    <rect x="0" y="0" width="185" height="3" fill="#306FE5"/>
    
    <text x="14" y="24" font-family="monospace" font-size="9" fill="#306FE5" font-weight="700" letter-spacing="1.5">04 // DECIDE</text>
    <text x="14" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#10233F" font-weight="700">Qualified Human Authority</text>
    
