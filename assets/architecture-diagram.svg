        <circle cx="75" cy="15" r="4" fill="#306FE5"/>
        <circle cx="80" cy="40" r="4" fill="#10233F"/>
        <circle cx="120" cy="26" r="4" fill="#306FE5"/>
        
        <line x1="35" y1="28" x2="75" y2="15" stroke="#10233F" stroke-width="1.2"/>
        <line x1="35" y1="28" x2="80" y2="40" stroke="#306FE5" stroke-width="1.2"/>
        <line x1="75" y1="15" x2="120" y2="26" stroke="#D4D9E2" stroke-width="1"/>
        <line x1="80" y1="40" x2="120" y2="26" stroke="#10233F" stroke-width="1.2"/>
        <line x1="75" y1="15" x2="80" y2="40" stroke="#306FE5" stroke-width="1" stroke-dasharray="2,2"/>

    </g>

    <!-- Narrative Description Text -->
    <text x="14" y="145" font-family="system-ui, sans-serif" font-size="9" fill="#10233F">
      <tspan x="14" dy="0">Resolves cross-document entities</tspan>
      <tspan x="14" dy="13">across disciplines. Converts isolated</tspan>
      <tspan x="14" dy="13">records into a queryable graph of</tspan>
      <tspan x="14" dy="13">spatial relations &amp; cited evidence.</tspan>
    </text>

    <line x1="14" y1="210" x2="171" y2="210" stroke="#D4D9E2" stroke-width="0.6"/>
