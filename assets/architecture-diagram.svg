    <text x="14" y="24" font-family="monospace" font-size="9" fill="#306FE5" font-weight="700" letter-spacing="1.5">02 // CONNECT</text>
    <text x="14" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#10233F" font-weight="700">Unified Knowledge Graph</text>
    
