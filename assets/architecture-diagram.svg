    <text x="14" y="24" font-family="monospace" font-size="9" fill="#10233F" font-weight="700" letter-spacing="1.5">03 // REASON</text>
    <text x="14" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#10233F" font-weight="700">Deterministic Verification</text>
    
    <rect x="14" y="48" width="93.2" height="14" fill="#F0F2F5" rx="1"/>
    <text x="20" y="58" font-family="monospace" font-size="6.5" fill="#10233F" font-weight="600" letter-spacing="0.5">HYBRID SOLVERS</text>

