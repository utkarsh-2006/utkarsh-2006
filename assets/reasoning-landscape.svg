<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260">
  <defs>
    <pattern id="rl-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.5" fill="#D4D9E2"/>
    </pattern>
  </defs>

  <rect width="880" height="260" fill="#FAF9F6"/>
  <rect width="880" height="260" fill="url(#rl-dots)"/>

  <!-- Blueprint Framing Border -->
  <rect x="25" y="15" width="830" height="230" fill="none" stroke="#D4D9E2" stroke-width="0.8"/>
  <line x1="25" y1="38" x2="855" y2="38" stroke="#D4D9E2" stroke-width="0.8"/>

  <text x="35" y="30" font-family="monospace" font-size="7.5" fill="#306FE5" font-weight="700" letter-spacing="1.5">REASONING TOPOLOGY // VERIFICATION LIFECYCLE</text>
  <text x="845" y="30" font-family="monospace" font-size="7" fill="#657187" text-anchor="end">SYSTEM ARCHITECTURE // SPEC.02</text>

  <!-- 4 Narrative Stations -->
  <!-- Station 1: Ingest & Parse (x=45, y=55) -->
  <g transform="translate(45, 55)">
    <rect x="0" y="0" width="175" height="155" fill="#FFFFFF" stroke="#D4D9E2" stroke-width="0.8"/>
    <rect x="0" y="0" width="175" height="2.5" fill="#10233F"/>
    
    <text x="12" y="18" font-family="monospace" font-size="7" fill="#657187">PHASE 01</text>
    <text x="12" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#10233F" font-weight="700">UNDERSTAND</text>
    <text x="12" y="44" font-family="system-ui, sans-serif" font-size="7.5" fill="#306FE5">Multimodal Ingestion</text>
    <line x1="12" y1="50" x2="163" y2="50" stroke="#D4D9E2" stroke-width="0.6"/>

    <!-- Document Drawing Glyph -->
    <g transform="translate(15, 60)">
      <rect x="0" y="0" width="38" height="48" fill="#FAF9F6" stroke="#10233F" stroke-width="1"/>
      <line x1="6" y1="10" x2="26" y2="10" stroke="#306FE5" stroke-width="1.2"/>
      <line x1="6" y1="18" x2="32" y2="18" stroke="#657187" stroke-width="0.8"/>
      <line x1="6" y1="24" x2="28" y2="24" stroke="#657187" stroke-width="0.8"/>
      <!-- CAD floorplan preview -->
      <rect x="6" y="30" width="26" height="12" fill="none" stroke="#657187" stroke-width="0.6"/>

      <!-- Parsing Ray -->
      <path d="M 46 24 L 75 24" stroke="#306FE5" stroke-width="1.2" stroke-dasharray="2,2"/>
      <polygon points="75,24 70,21 70,27" fill="#306FE5"/>

      <!-- Extracted Token stream -->
      <circle cx="95" cy="16" r="3" fill="#10233F"/>
      <circle cx="115" cy="24" r="3" fill="#306FE5"/>
      <circle cx="98" cy="34" r="2.5" fill="#657187"/>
      <line x1="95" y1="16" x2="115" y2="24" stroke="#D4D9E2" stroke-width="0.8"/>
      <line x1="98" y1="34" x2="115" y2="24" stroke="#D4D9E2" stroke-width="0.8"/>
    </g>

    <text x="12" y="128" font-family="system-ui, sans-serif" font-size="8" fill="#657187">Native CAD, BIM/IFC &amp; Specs parsed into structured entities.</text>
    <text x="12" y="144" font-family="monospace" font-size="6.5" fill="#10233F">TECH: DOCLING · OCR · VISION</text>
  </g>

  <!-- Flow Connector 1 -->
  <g transform="translate(225, 130)">
    <line x1="0" y1="0" x2="15" y2="0" stroke="#306FE5" stroke-width="1.2"/>
    <polygon points="15,0 10,-3 10,3" fill="#306FE5"/>
  </g>

  <!-- Station 2: Knowledge Graph (x=245, y=55) -->
  <g transform="translate(245, 55)">
    <rect x="0" y="0" width="175" height="155" fill="#FFFFFF" stroke="#D4D9E2" stroke-width="0.8"/>
    <rect x="0" y="0" width="175" height="2.5" fill="#306FE5"/>
    
    <text x="12" y="18" font-family="monospace" font-size="7" fill="#657187">PHASE 02</text>
    <text x="12" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#10233F" font-weight="700">CONNECT</text>
    <text x="12" y="44" font-family="system-ui, sans-serif" font-size="7.5" fill="#306FE5">Relational Graph Schema</text>
    <line x1="12" y1="50" x2="163" y2="50" stroke="#D4D9E2" stroke-width="0.6"/>

    <!-- Graph Schema Glyph -->
    <g transform="translate(87.5, 84)">
      <circle cx="0" cy="0" r="5.5" fill="#10233F"/>
      <circle cx="0" cy="0" r="9" fill="none" stroke="#306FE5" stroke-width="0.8" stroke-dasharray="2,2"/>
      
      <circle cx="-40" cy="-18" r="3" fill="#306FE5"/>
      <circle cx="40" cy="-15" r="3" fill="#306FE5"/>
      <circle cx="-30" cy="24" r="3" fill="#657187"/>
      <circle cx="35" cy="22" r="3" fill="#657187"/>

      <line x1="0" y1="0" x2="-40" y2="-18" stroke="#10233F" stroke-width="1"/>
      <line x1="0" y1="0" x2="40" y2="-15" stroke="#10233F" stroke-width="1"/>
      <line x1="0" y1="0" x2="-30" y2="24" stroke="#306FE5" stroke-width="1"/>
      <line x1="0" y1="0" x2="35" y2="22" stroke="#306FE5" stroke-width="1"/>
    </g>

    <text x="12" y="128" font-family="system-ui, sans-serif" font-size="8" fill="#657187">Cross-record dependencies linked with cited evidence.</text>
    <text x="12" y="144" font-family="monospace" font-size="6.5" fill="#10233F">TECH: NEO4J · PROPERTY GRAPH</text>
  </g>

  <!-- Flow Connector 2 -->
  <g transform="translate(425, 130)">
    <line x1="0" y1="0" x2="15" y2="0" stroke="#306FE5" stroke-width="1.2"/>
    <polygon points="15,0 10,-3 10,3" fill="#306FE5"/>
  </g>

  <!-- Station 3: Deterministic Solvers (x=445, y=55) -->
  <g transform="translate(445, 55)">
    <rect x="0" y="0" width="175" height="155" fill="#FFFFFF" stroke="#D4D9E2" stroke-width="0.8"/>
    <rect x="0" y="0" width="175" height="2.5" fill="#10233F"/>
    
    <text x="12" y="18" font-family="monospace" font-size="7" fill="#657187">PHASE 03</text>
    <text x="12" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#10233F" font-weight="700">REASON</text>
    <text x="12" y="44" font-family="system-ui, sans-serif" font-size="7.5" fill="#306FE5">Deterministic Checks</text>
    <line x1="12" y1="50" x2="163" y2="50" stroke="#D4D9E2" stroke-width="0.6"/>

    <!-- Geometry Solver Glyph -->
    <g transform="translate(25, 60)">
      <rect x="10" y="5" width="45" height="32" fill="none" stroke="#10233F" stroke-width="1"/>
      <rect x="30" y="14" width="45" height="32" fill="#EBF2FC" fill-opacity="0.4" stroke="#306FE5" stroke-width="1"/>
      <line x1="30" y1="14" x2="55" y2="37" stroke="#306FE5" stroke-width="1" stroke-dasharray="1.5,1.5"/>
      <circle cx="42" cy="10" r="3" fill="#D32F2F"/>
      <text x="82" y="24" font-family="monospace" font-size="6.5" fill="#D32F2F" font-weight="700">COLLISION</text>
    </g>

    <text x="12" y="128" font-family="system-ui, sans-serif" font-size="8" fill="#657187">Geometric clash detection &amp; code constraint solvers.</text>
    <text x="12" y="144" font-family="monospace" font-size="6.5" fill="#10233F">TECH: NUMPY · SCIPY · RULE ENG</text>
  </g>

  <!-- Flow Connector 3 -->
  <g transform="translate(625, 130)">
    <line x1="0" y1="0" x2="15" y2="0" stroke="#306FE5" stroke-width="1.2"/>
    <polygon points="15,0 10,-3 10,3" fill="#306FE5"/>
  </g>

  <!-- Station 4: Auditable Human Authority (x=645, y=55) -->
  <g transform="translate(645, 55)">
    <rect x="0" y="0" width="185" height="155" fill="#FFFFFF" stroke="#D4D9E2" stroke-width="0.8"/>
    <rect x="0" y="0" width="185" height="2.5" fill="#306FE5"/>
    
    <text x="12" y="18" font-family="monospace" font-size="7" fill="#657187">PHASE 04</text>
    <text x="12" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#10233F" font-weight="700">DECIDE</text>
    <text x="12" y="44" font-family="system-ui, sans-serif" font-size="7.5" fill="#306FE5">Certified Human Review</text>
    <line x1="12" y1="50" x2="173" y2="50" stroke="#D4D9E2" stroke-width="0.6"/>

    <!-- Certified Decision Glyph -->
    <g transform="translate(20, 60)">
      <rect x="0" y="0" width="90" height="38" fill="#FAF9F6" stroke="#D4D9E2" stroke-width="0.8"/>
      <rect x="8" y="8" width="30" height="4" fill="#306FE5"/>
      <rect x="8" y="16" width="55" height="3" fill="#D4D9E2"/>
      <rect x="8" y="22" width="45" height="3" fill="#D4D9E2"/>
      <circle cx="115" cy="20" r="10" fill="none" stroke="#306FE5" stroke-width="1.2"/>
      <path d="M 111 20 L 114 23 L 120 17" fill="none" stroke="#306FE5" stroke-width="1.5"/>
    </g>

    <text x="12" y="128" font-family="system-ui, sans-serif" font-size="8" fill="#657187">Findings arrive with source citations; human decides.</text>
    <text x="12" y="144" font-family="monospace" font-size="6.5" fill="#10233F">TECH: THREE.JS · AUDIT DOSSIER</text>
  </g>

  <!-- Bottom Annotation Rule -->
  <line x1="25" y1="245" x2="855" y2="245" stroke="#D4D9E2" stroke-width="0.8"/>
</svg>