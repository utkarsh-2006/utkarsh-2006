<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340">
  <defs>
    <!-- Blueprint Drafting Grid -->
    <pattern id="bp-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D4D9E2" stroke-width="0.35" opacity="0.6"/>
      <circle cx="20" cy="20" r="0.4" fill="#657187" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="880" height="340" fill="#FAF9F6"/>
  <rect width="880" height="340" fill="url(#bp-grid)"/>

  <!-- Blueprint Perimeter Drafting Border with Registration Marks -->
  <rect x="25" y="20" width="830" height="300" fill="none" stroke="#D4D9E2" stroke-width="0.8"/>
  
  <!-- Registration Crosshairs on 4 corners -->
  <g stroke="#657187" stroke-width="0.6" opacity="0.7">
    <!-- Top-Left -->
    <line x1="20" y1="20" x2="30" y2="20"/>
    <line x1="25" y1="15" x2="25" y2="25"/>
    <!-- Top-Right -->
    <line x1="850" y1="20" x2="860" y2="20"/>
    <line x1="855" y1="15" x2="855" y2="25"/>
    <!-- Bottom-Left -->
    <line x1="20" y1="320" x2="30" y2="320"/>
    <line x1="25" y1="315" x2="25" y2="325"/>
    <!-- Bottom-Right -->
    <line x1="850" y1="320" x2="860" y2="320"/>
    <line x1="855" y1="315" x2="855" y2="325"/>
  </g>

  <!-- Precision Technical Header Bar -->
  <line x1="25" y1="42" x2="855" y2="42" stroke="#D4D9E2" stroke-width="0.8"/>
  <rect x="25" y="20" width="120" height="22" fill="#FFFFFF" stroke="#D4D9E2" stroke-width="0.8"/>
  <text x="35" y="34" font-family="monospace" font-size="7" fill="#306FE5" font-weight="700" letter-spacing="1.5">STUDIO // SPEC-01</text>
  
  <text x="160" y="34" font-family="monospace" font-size="7" fill="#657187" letter-spacing="1">PROJECT: ENGINEERING INTELLIGENCE</text>
  <text x="845" y="34" font-family="monospace" font-size="7" fill="#657187" text-anchor="end" letter-spacing="1">COORD: 13°04'57"N 80°16'14"E · REV: 2026.A</text>

  <!-- Left Editorial Typography & Studio Statement -->
  <g transform="translate(50, 65)">
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#306FE5" letter-spacing="3.5">COMPUTATIONAL DESIGN &amp; REASONING</text>
    
    <text x="0" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="800" fill="#10233F" letter-spacing="-1.5">Utkarsh Sai Sidhardh</text>
    
    <text x="0" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="14.5" font-weight="400" fill="#10233F" letter-spacing="-0.2">
      Architectural engineering intelligence, reasoning graphs &amp; deterministic tools.
    </text>

    <!-- Blueprint Drafting Annotation Box -->
    <g transform="translate(0, 130)">
      <rect x="0" y="0" width="370" height="58" fill="#FFFFFF" stroke="#D4D9E2" stroke-width="0.8"/>
      <rect x="0" y="0" width="3" height="58" fill="#306FE5"/>
      
      <!-- Selection Bracket Visual Details -->
      <path d="M 360 8 L 366 8 L 366 14" fill="none" stroke="#306FE5" stroke-width="1"/>
      <path d="M 360 50 L 366 50 L 366 44" fill="none" stroke="#306FE5" stroke-width="1"/>

      <text x="14" y="20" font-family="monospace" font-size="7" fill="#306FE5" font-weight="700" letter-spacing="1">PARADIGM &amp; THESIS STATEMENT</text>
      <text x="14" y="36" font-family="system-ui, sans-serif" font-size="10.5" fill="#657187">
        Bridging multimodal AI (spatial vision, document semantics, BIM/IFC)
      </text>
      <text x="14" y="49" font-family="system-ui, sans-serif" font-size="10.5" fill="#657187">
        with deterministic geometric solvers and auditable citation networks.
      </text>
    </g>

    <!-- Metadata Technical Blueprint Strip -->
    <g transform="translate(0, 206)">
      <rect x="0" y="0" width="85" height="18" fill="#FFFFFF" stroke="#D4D9E2" stroke-width="0.8"/>
      <text x="42.5" y="12" font-family="monospace" font-size="7" fill="#10233F" text-anchor="middle" font-weight="700">AEC SYSTEMS</text>

      <rect x="95" y="0" width="115" height="18" fill="#FFFFFF" stroke="#D4D9E2" stroke-width="0.8"/>
      <text x="152.5" y="12" font-family="monospace" font-size="7" fill="#10233F" text-anchor="middle" font-weight="700">SPATIAL GRAPHS</text>

      <rect x="220" y="0" width="125" height="18" fill="#FFFFFF" stroke="#D4D9E2" stroke-width="0.8"/>
      <text x="282.5" y="12" font-family="monospace" font-size="7" fill="#10233F" text-anchor="middle" font-weight="700">DETERMINISTIC SOLVERS</text>
    </g>
  </g>

  <!-- Right Architectural Axonometric Studio Drafting Illustration -->
  <g transform="translate(485, 55)">
    <!-- Drafting Framing Bounds with Corner Ticks -->
    <rect x="0" y="0" width="345" height="235" fill="#FFFFFF" stroke="#D4D9E2" stroke-width="0.8"/>
    
    <!-- Top Blueprint Title -->
    <rect x="0" y="0" width="345" height="20" fill="#FAF9F6" stroke="#D4D9E2" stroke-width="0.6"/>
    <text x="12" y="13" font-family="monospace" font-size="6.5" fill="#10233F" font-weight="700">AXONOMETRIC SPATIAL ASSEMBLY // FIG. 01</text>
    <text x="333" y="13" font-family="monospace" font-size="6.5" fill="#657187" text-anchor="end">SCALE: 1:100</text>

    <!-- Drafting Construction Grid Lines (30-degree isometric angle) -->
    <g transform="translate(172.5, 175)">
      <!-- Ground Plate (Level 00 Base Drawing) -->
      <polygon points="0,-45 125,18 0,80 -125,18" fill="#FAF9F6" stroke="#D4D9E2" stroke-width="1"/>
      <polygon points="0,-45 0,80" stroke="#D4D9E2" stroke-width="0.6" stroke-dasharray="2,2"/>
      <polygon points="-125,18 125,18" stroke="#D4D9E2" stroke-width="0.6" stroke-dasharray="2,2"/>

      <!-- Floor Plan Internal Room Partitions -->
      <line x1="-60" y1="-10" x2="20" y2="30" stroke="#657187" stroke-width="0.8" opacity="0.6"/>
      <line x1="-30" y1="36" x2="70" y2="-14" stroke="#657187" stroke-width="0.8" opacity="0.6"/>
      
      <!-- Selection Highlight Envelope on Column Bay C-4 -->
      <rect x="-18" y="14" width="24" height="16" fill="#EBF2FC" stroke="#306FE5" stroke-width="1.2" stroke-dasharray="2,2" transform="skewX(-30) rotate(15)"/>
      <text x="-24" y="38" font-family="monospace" font-size="6" fill="#306FE5" font-weight="700">BAY C-4</text>

      <!-- Vertical Extrusion Construction Guidelines (Connecting floor to upper structural layer) -->
      <line x1="-80" y1="18" x2="-80" y2="-55" stroke="#D4D9E2" stroke-width="0.8" stroke-dasharray="2,3"/>
      <line x1="80" y1="18" x2="80" y2="-55" stroke="#D4D9E2" stroke-width="0.8" stroke-dasharray="2,3"/>
      <line x1="0" y1="80" x2="0" y2="8" stroke="#306FE5" stroke-width="1" stroke-dasharray="2,3"/>

      <!-- Floating Relational Knowledge Graph Plate (Level 01) -->
      <g transform="translate(0, -65)">
        <polygon points="0,-40 115,16 0,72 -115,16" fill="#FFFFFF" fill-opacity="0.85" stroke="#306FE5" stroke-width="1.2"/>
        
        <!-- Relational Graph Nodes -->
        <circle cx="0" cy="16" r="5" fill="#10233F"/>
        <circle cx="0" cy="16" r="9" fill="none" stroke="#306FE5" stroke-width="0.8" stroke-dasharray="2,2"/>

        <circle cx="-55" cy="0" r="3.5" fill="#306FE5"/>
        <circle cx="55" cy="-5" r="3.5" fill="#306FE5"/>
        <circle cx="-35" cy="42" r="3" fill="#10233F"/>
        <circle cx="45" cy="38" r="3" fill="#10233F"/>

        <!-- Graph Edge Vectors -->
        <line x1="0" y1="16" x2="-55" y2="0" stroke="#10233F" stroke-width="1.2"/>
        <line x1="0" y1="16" x2="55" y2="-5" stroke="#10233F" stroke-width="1.2"/>
        <line x1="0" y1="16" x2="-35" y2="42" stroke="#306FE5" stroke-width="1.2"/>
        <line x1="0" y1="16" x2="45" y2="38" stroke="#306FE5" stroke-width="1.2"/>
        <line x1="-55" y1="0" x2="-35" y2="42" stroke="#D4D9E2" stroke-width="0.8"/>
        <line x1="55" y1="-5" x2="45" y2="38" stroke="#D4D9E2" stroke-width="0.8"/>

        <!-- Dimension Witness Line Callout -->
        <line x1="55" y1="-5" x2="95" y2="-20" stroke="#657187" stroke-width="0.8"/>
        <line x1="95" y1="-20" x2="140" y2="-20" stroke="#657187" stroke-width="0.8"/>
        <text x="98" y="-24" font-family="monospace" font-size="6.5" fill="#10233F" font-weight="700">LINK: SPEC ➔ BIM</text>
        <text x="98" y="-14" font-family="monospace" font-size="6" fill="#657187">CONF: 0.984</text>
      </g>

      <!-- Raycast Vector to Verified Resolution -->
      <g transform="translate(0, -125)">
        <line x1="0" y1="60" x2="0" y2="0" stroke="#306FE5" stroke-width="1.5"/>
        <polygon points="0,-5 -3.5,6 3.5,6" fill="#306FE5"/>
        <circle cx="0" cy="-5" r="12" fill="none" stroke="#306FE5" stroke-width="0.8" opacity="0.4"/>
        
        <!-- Drafting Callout Tag -->
        <line x1="0" y1="-5" x2="-45" y2="-18" stroke="#306FE5" stroke-width="0.8"/>
        <line x1="-45" y1="-18" x2="-120" y2="-18" stroke="#306FE5" stroke-width="0.8"/>
        <text x="-115" y="-22" font-family="monospace" font-size="6.5" fill="#306FE5" font-weight="700">VERIFIED RESOLUTION</text>
        <text x="-115" y="-12" font-family="monospace" font-size="6" fill="#657187">STATUS: CERTIFIED</text>
      </g>
    </g>

    <!-- Bottom Drawing Coordinates -->
    <text x="12" y="222" font-family="monospace" font-size="6" fill="#657187">GRID: [100.0, 100.0] · AZIMUTH: 30.0° · PROJECTION: AXONOMETRIC</text>
  </g>

  <!-- Bottom Title Block / Technical Data Register -->
  <g transform="translate(25, 312)">
    <rect x="0" y="0" width="830" height="8" fill="#10233F"/>
    <rect x="0" y="0" width="180" height="8" fill="#306FE5"/>
  </g>
</svg>