<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" width="940" height="350">
  <defs>
    <!-- Blueprint Drafting Grid -->
    <pattern id="bp-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D4D9E2" stroke-width="0.35" opacity="0.5"/>
      <circle cx="20" cy="20" r="0.35" fill="#657187" opacity="0.3"/>
    </pattern>
    <!-- Linear Gradients for Depth -->
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10233F"/>
      <stop offset="100%" stop-color="#19355E"/>
    </linearGradient>
    <linearGradient id="plane-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FAF9F6" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#306FE5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#306FE5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="940" height="350" fill="#FAF9F6"/>
  <rect width="940" height="350" fill="url(#bp-grid)"/>

  <!-- Blueprint Perimeter Drafting Frame -->
  <rect x="20" y="18" width="900" height="314" fill="none" stroke="#D4D9E2" stroke-width="0.8"/>

  <!-- Registration Corner Marks -->
  <g stroke="#657187" stroke-width="0.6" opacity="0.6">
    <line x1="15" y1="18" x2="25" y2="18"/>
    <line x1="20" y1="13" x2="20" y2="23"/>
    <line x1="915" y1="18" x2="925" y2="18"/>
    <line x1="920" y1="13" x2="920" y2="23"/>
    <line x1="15" y1="332" x2="25" y2="332"/>
    <line x1="20" y1="327" x2="20" y2="337"/>
    <line x1="915" y1="332" x2="925" y2="332"/>
    <line x1="920" y1="327" x2="920" y2="337"/>
  </g>

  <!-- Technical Top Datum Rule -->
  <line x1="20" y1="40" x2="920" y2="40" stroke="#D4D9E2" stroke-width="0.8"/>
  <text x="36" y="32" font-family="ui-monospace, monospace" font-size="7" fill="#306FE5" font-weight="700" letter-spacing="1.5">SYS // 01</text>
  <text x="105" y="32" font-family="ui-monospace, monospace" font-size="7" fill="#657187" letter-spacing="1.2">PORTFOLIO SPECIFICATION</text>
  <text x="904" y="32" font-family="ui-monospace, monospace" font-size="7" fill="#657187" text-anchor="end" letter-spacing="1">CHENNAI, IN · 2026</text>

  <!-- ======================================================== -->
  <!-- LEFT SECTION: Typography & Identity (Strictly Separated) -->
  <!-- ======================================================== -->
  <g transform="translate(46, 75)">
    <!-- Discipline Identifier -->
    <text x="0" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#306FE5" letter-spacing="3.2">SOFTWARE ENGINEERING / AI SYSTEMS</text>

    <!-- Primary Full Name with Initial K (No overlap) -->
    <text x="0" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="33" font-weight="800" fill="#10233F" letter-spacing="-1">K Utkarsh Sai Sidhardh</text>

    <!-- Preferred Headline -->
    <text x="0" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#10233F" letter-spacing="-0.3">
      "Building useful software for complex problems."
    </text>

    <!-- Supporting Discipline Summary -->
    <text x="0" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="500" fill="#657187" letter-spacing="0.2">
      AI systems · Developer tools · Full-stack engineering
    </text>

    <!-- Clean Technical Datum Line -->
    <g transform="translate(0, 188)">
      <line x1="0" y1="0" x2="310" y2="0" stroke="#D4D9E2" stroke-width="0.8"/>
      <rect x="0" y="-3" width="6" height="6" fill="#306FE5"/>
      <circle cx="310" cy="0" r="2" fill="#657187"/>
      <text x="14" y="14" font-family="ui-monospace, monospace" font-size="7.5" fill="#657187" letter-spacing="1">
        VERIFIABLE STATE · CLIENT-FIRST RUNTIMES
      </text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT SECTION: Dedicated Computational Illustration      -->
  <!-- ======================================================== -->
  <g transform="translate(445, 38)">

    <!-- Blueprint Drafting Background Sub-grid -->
    <g opacity="0.85">
      <!-- Outer Illustration Datum Box -->
      <rect x="0" y="12" width="475" height="270" fill="#FFFFFF" stroke="#D4D9E2" stroke-width="0.8"/>

      <!-- Compass Crosshairs -->
      <line x1="237.5" y1="12" x2="237.5" y2="282" stroke="#D4D9E2" stroke-width="0.5" stroke-dasharray="3,3"/>
      <line x1="0" y1="147" x2="475" y2="147" stroke="#D4D9E2" stroke-width="0.5" stroke-dasharray="3,3"/>

      <!-- Background Concentric Orbital Guides -->
      <circle cx="237.5" cy="147" r="110" fill="none" stroke="#D4D9E2" stroke-width="0.5" stroke-dasharray="4,4"/>
      <circle cx="237.5" cy="147" r="68" fill="none" stroke="#D4D9E2" stroke-width="0.5" opacity="0.7"/>
    </g>

    <!-- Header for Drafting Frame -->
    <rect x="0" y="12" width="475" height="20" fill="#FAF9F6" stroke="#D4D9E2" stroke-width="0.6"/>
    <text x="14" y="25" font-family="ui-monospace, monospace" font-size="7" fill="#10233F" font-weight="700" letter-spacing="1">COMPUTATIONAL ARCHITECTURE // SYNTHESIS</text>
    <text x="460" y="25" font-family="ui-monospace, monospace" font-size="7" fill="#657187" text-anchor="end" letter-spacing="0.8">SYSTEM SCHEMATIC</text>

    <!-- MAIN THREE-TIERED COMPUTATIONAL STRUCTURE -->
    <g transform="translate(237.5, 205)">

      <!-- TIER 01 (Base): Wide Foundation State & Event Mesh -->
      <g>
        <!-- Isometric Base Rhomboid (Wide Foundation) -->
        <polygon points="0,-58 185,14 0,86 -185,14" fill="#FAF9F6" stroke="#D4D9E2" stroke-width="1.2"/>
        <!-- Inner Offset Wireframe Grid -->
        <polygon points="0,-42 145,14 0,70 -145,14" fill="#FFFFFF" stroke="#D4D9E2" stroke-width="0.8"/>

        <!-- Internal Isometric Grid Lines -->
        <line x1="-90" y1="-14" x2="55" y2="42" stroke="#D4D9E2" stroke-width="0.6"/>
        <line x1="-55" y1="42" x2="90" y2="-14" stroke="#D4D9E2" stroke-width="0.6"/>
        <line x1="-145" y1="14" x2="145" y2="14" stroke="#306FE5" stroke-width="0.6" stroke-dasharray="3,3"/>
        <line x1="0" y1="-58" x2="0" y2="86" stroke="#306FE5" stroke-width="0.6" stroke-dasharray="3,3"/>

        <!-- Peripheral Distributed Nodes on the Base Mesh -->
        <circle cx="-125" cy="14" r="3.5" fill="#10233F"/>
        <circle cx="125" cy="14" r="3.5" fill="#10233F"/>
        <circle cx="-80" cy="-14" r="3" fill="#306FE5"/>
        <circle cx="80" cy="-14" r="3" fill="#306FE5"/>
        <circle cx="-60" cy="42" r="3" fill="#306FE5"/>
        <circle cx="60" cy="42" r="3" fill="#306FE5"/>

        <!-- Data Path Bus Lines on Plane -->
        <line x1="-125" y1="14" x2="-80" y2="-14" stroke="#306FE5" stroke-width="1"/>
        <line x1="-80" y1="-14" x2="0" y2="14" stroke="#10233F" stroke-width="1"/>
        <line x1="0" y1="14" x2="80" y2="-14" stroke="#10233F" stroke-width="1"/>
        <line x1="80" y1="-14" x2="125" y2="14" stroke="#306FE5" stroke-width="1"/>
        <line x1="-125" y1="14" x2="-60" y2="42" stroke="#D4D9E2" stroke-width="0.8"/>
        <line x1="125" y1="14" x2="60" y2="42" stroke="#D4D9E2" stroke-width="0.8"/>
      </g>

      <!-- Vertical Standoff Vectors (Connecting Base to Mid Plane) -->
      <line x1="-110" y1="14" x2="-110" y2="-45" stroke="#306FE5" stroke-width="1" stroke-dasharray="2,3"/>
      <line x1="110" y1="14" x2="110" y2="-45" stroke="#306FE5" stroke-width="1" stroke-dasharray="2,3"/>
      <line x1="0" y1="55" x2="0" y2="-20" stroke="#D4D9E2" stroke-width="0.8" stroke-dasharray="2,2"/>
      <line x1="0" y1="-42" x2="0" y2="-85" stroke="#D4D9E2" stroke-width="0.8" stroke-dasharray="2,2"/>

      <!-- TIER 02 (Mid): Floating Application & Runtime Layer -->
      <g transform="translate(0, -52)">
        <!-- Floating Isometric Plane -->
        <polygon points="0,-46 135,8 0,62 -135,8" fill="url(#plane-grad)" stroke="#306FE5" stroke-width="1.4"/>

        <!-- Modular Application Surface Blocks on the Plane -->
        <!-- Left Sub-surface: Document / AST Structure -->
        <polygon points="-95,5 -28,-18 -28,6 -95,29" fill="#EBF2FC" stroke="#306FE5" stroke-width="0.8"/>
        <line x1="-85" y1="11" x2="-38" y2="-6" stroke="#306FE5" stroke-width="0.8"/>
        <line x1="-85" y1="18" x2="-48" y2="5" stroke="#657187" stroke-width="0.6"/>
        <line x1="-85" y1="24" x2="-58" y2="14" stroke="#657187" stroke-width="0.6"/>

        <!-- Right Sub-surface: WASM Runtime / Engine Sandbox -->
        <polygon points="28,-18 95,5 95,29 28,6" fill="#FAF9F6" stroke="#10233F" stroke-width="0.8"/>
        <circle cx="52" cy="-2" r="2.5" fill="#306FE5"/>
        <circle cx="72" cy="5" r="2.5" fill="#10233F"/>
        <line x1="52" y1="-2" x2="72" y2="5" stroke="#10233F" stroke-width="0.8"/>

        <!-- Center Standoff Axis Marker -->
        <circle cx="0" cy="8" r="4.5" fill="#FFFFFF" stroke="#306FE5" stroke-width="1.2"/>
        <circle cx="0" cy="8" r="1.8" fill="#306FE5"/>
      </g>

      <!-- Vertical Standoff Rays from Mid Layer to Central Intelligence Core -->
      <line x1="-48" y1="-44" x2="-26" y2="-95" stroke="#306FE5" stroke-width="1"/>
      <line x1="48" y1="-44" x2="26" y2="-95" stroke="#306FE5" stroke-width="1"/>
      <line x1="0" y1="-44" x2="0" y2="-100" stroke="#306FE5" stroke-width="1.5"/>

      <!-- TIER 03 (Apex): Striking Central Geometric Core -->
      <g transform="translate(0, -118)">

        <!-- Radiant Glow Field behind Core -->
        <polygon points="0,-48 70,0 0,48 -70,0" fill="url(#glow-grad)"/>

        <!-- Outer Orbit Hexagonal Frame -->
        <polygon points="0,-42 62,-10 62,24 0,56 -62,24 -62,-10" fill="none" stroke="#306FE5" stroke-width="0.9" stroke-dasharray="3,3"/>

        <!-- Precision Orbital Satellite Nodes -->
        <circle cx="-62" cy="-10" r="3" fill="#FFFFFF" stroke="#306FE5" stroke-width="1.2"/>
        <circle cx="62" cy="-10" r="3" fill="#FFFFFF" stroke="#306FE5" stroke-width="1.2"/>
        <circle cx="-62" cy="24" r="3" fill="#10233F"/>
        <circle cx="62" cy="24" r="3" fill="#10233F"/>
        <circle cx="0" cy="56" r="3.5" fill="#306FE5"/>

        <!-- The Central Multi-Faceted Crystal/Diamond Core -->
        <polygon points="0,-36 46,0 0,36 -46,0" fill="url(#core-grad)" stroke="#306FE5" stroke-width="1.6"/>

        <!-- Facet Division Lines -->
        <line x1="0" y1="-36" x2="0" y2="36" stroke="#306FE5" stroke-width="1.2"/>
        <line x1="-46" y1="0" x2="46" y2="0" stroke="#306FE5" stroke-width="0.8"/>
        <polygon points="0,-36 28,-10 0,16 -28,-10" fill="#306FE5" fill-opacity="0.35"/>

        <!-- Inner Core Spark Node -->
        <circle cx="0" cy="0" r="8" fill="#10233F" stroke="#FFFFFF" stroke-width="1"/>
        <circle cx="0" cy="0" r="3" fill="#306FE5"/>

        <!-- Upper Projecting Precision Beacon -->
        <line x1="0" y1="-36" x2="0" y2="-54" stroke="#306FE5" stroke-width="1.4"/>
        <polygon points="0,-60 -3.5,-53 3.5,-53" fill="#306FE5"/>
        <circle cx="0" cy="-60" r="8" fill="none" stroke="#306FE5" stroke-width="0.6" stroke-dasharray="2,2"/>

        <!-- Clean Callout Annotation -->
        <line x1="38" y1="-16" x2="78" y2="-32" stroke="#657187" stroke-width="0.8"/>
        <line x1="78" y1="-32" x2="140" y2="-32" stroke="#657187" stroke-width="0.8"/>
        <text x="82" y="-36" font-family="ui-monospace, monospace" font-size="7" fill="#10233F" font-weight="700" letter-spacing="0.5">COMPUTATIONAL CORE</text>
        <text x="82" y="-24" font-family="ui-monospace, monospace" font-size="6.5" fill="#306FE5">VERIFIED INFERENCE</text>
      </g>
    </g>

    <!-- Bottom Coordinate Datum -->
    <text x="14" y="272" font-family="ui-monospace, monospace" font-size="6.5" fill="#657187" letter-spacing="0.8">
      AXONOMETRIC 30° · MULTI-SURFACE ORCHESTRATION · DETERMINISTIC PIPELINE
    </text>
  </g>

  <!-- Bottom Accent Stripe -->
  <line x1="20" y1="324" x2="920" y2="324" stroke="#D4D9E2" stroke-width="0.6"/>
  <rect x="20" y="322" width="180" height="4" fill="#306FE5"/>
</svg>
