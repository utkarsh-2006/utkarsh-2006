<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300">
  <defs>
    <pattern id="sys-dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.6" fill="#D4D9E2"/>
    </pattern>
  </defs>

  <rect width="880" height="300" fill="#FAF9F6"/>
  <rect width="880" height="300" fill="url(#sys-dots)"/>

  <!-- Top Title -->
  <g transform="translate(45, 24)">
    <text x="0" y="0" font-family="monospace" font-size="8" fill="#306FE5" letter-spacing="2" font-weight="700">DISTRIBUTED ARCHITECTURE // SYSTEM BOUNDARIES</text>
    <text x="0" y="16" font-family="system-ui, sans-serif" font-size="14" fill="#10233F" font-weight="700">Layered Execution: Edge Clients, Deterministic Services, and State Stores</text>
    <line x1="0" y1="26" x2="790" y2="26" stroke="#D4D9E2" stroke-width="0.8"/>
  </g>

  <!-- 4 Architectural Tiers (Horizontal Stacking) -->
  <!-- Tier 1: Clients & Applications (x=45, y=65) -->
  <g transform="translate(45, 65)">
    <rect x="0" y="0" width="170" height="175" fill="#FFFFFF" stroke="#D4D9E2" stroke-width="1"/>
    <rect x="0" y="0" width="170" height="3" fill="#10233F"/>
    <text x="12" y="18" font-family="monospace" font-size="7" fill="#657187">TIER 01</text>
    <text x="12" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#10233F" font-weight="700">CLIENTS &amp; UI</text>
    <line x1="12" y1="38" x2="158" y2="38" stroke="#D4D9E2" stroke-width="0.6"/>

    <g transform="translate(12, 48)">
      <rect x="0" y="0" width="146" height="24" fill="#FAF9F6" stroke="#D4D9E2" stroke-width="0.8"/>
      <text x="8" y="15" font-family="system-ui, sans-serif" font-size="8" fill="#10233F" font-weight="600">Flutter Mobile Apps</text>

      <rect x="0" y="30" width="146" height="24" fill="#FAF9F6" stroke="#D4D9E2" stroke-width="0.8"/>
      <text x="8" y="45" font-family="system-ui, sans-serif" font-size="8" fill="#10233F" font-weight="600">Next.js / Vite Dashboards</text>

      <rect x="0" y="60" width="146" height="24" fill="#FAF9F6" stroke="#D4D9E2" stroke-width="0.8"/>
      <text x="8" y="75" font-family="system-ui, sans-serif" font-size="8" fill="#10233F" font-weight="600">HTML5 Canvas Engines</text>

      <rect x="0" y="90" width="146" height="24" fill="#FAF9F6" stroke="#D4D9E2" stroke-width="0.8"/>
      <text x="8" y="105" font-family="system-ui, sans-serif" font-size="8" fill="#10233F" font-weight="600">GIS / Leaflet Portals</text>
    </g>
  </g>

  <!-- Connection Arrows Tier 1 -> Tier 2 -->
  <g transform="translate(220, 150)">
    <line x1="0" y1="0" x2="15" y2="0" stroke="#306FE5" stroke-width="1.2"/>
    <polygon points="15,0 10,-3 10,3" fill="#306FE5"/>
    <text x="7.5" y="-6" font-family="monospace" font-size="6" fill="#306FE5" text-anchor="middle">REST / WS</text>
  </g>

  <!-- Tier 2: API Gateway & Service Ingestion (x=245, y=65) -->
  <g transform="translate(245, 65)">
    <rect x="0" y="0" width="170" height="175" fill="#FFFFFF" stroke="#D4D9E2" stroke-width="1"/>
    <rect x="0" y="0" width="170" height="3" fill="#306FE5"/>
    <text x="12" y="18" font-family="monospace" font-size="7" fill="#657187">TIER 02</text>
    <text x="12" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#10233F" font-weight="700">API &amp; ROUTING</text>
    <line x1="12" y1="38" x2="158" y2="38" stroke="#D4D9E2" stroke-width="0.6"/>

    <g transform="translate(12, 48)">
