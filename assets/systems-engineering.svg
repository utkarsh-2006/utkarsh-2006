  <g transform="translate(655, 65)">
    <rect x="0" y="0" width="180" height="175" fill="#FFFFFF" stroke="#D4D9E2" stroke-width="1"/>
    <rect x="0" y="0" width="180" height="3" fill="#306FE5"/>
    <text x="12" y="18" font-family="monospace" font-size="7" fill="#657187">TIER 04</text>
    <text x="12" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#10233F" font-weight="700">PERSISTENCE &amp; GRAPH</text>
    <line x1="12" y1="38" x2="168" y2="38" stroke="#D4D9E2" stroke-width="0.6"/>

    <g transform="translate(12, 48)">
      <rect x="0" y="0" width="156" height="24" fill="#FAF9F6" stroke="#D4D9E2" stroke-width="0.8"/>
      <text x="8" y="15" font-family="system-ui, sans-serif" font-size="8" fill="#10233F" font-weight="600">Neo4j Entity Property Graph</text>

      <rect x="0" y="30" width="156" height="24" fill="#FAF9F6" stroke="#D4D9E2" stroke-width="0.8"/>
      <text x="8" y="45" font-family="system-ui, sans-serif" font-size="8" fill="#10233F" font-weight="600">PostgreSQL / Cloud Firestore</text>

      <rect x="0" y="60" width="156" height="24" fill="#FAF9F6" stroke="#D4D9E2" stroke-width="0.8"/>
      <text x="8" y="75" font-family="system-ui, sans-serif" font-size="8" fill="#10233F" font-weight="600">Hive Local Key-Value Store</text>

      <rect x="0" y="90" width="156" height="24" fill="#FAF9F6" stroke="#D4D9E2" stroke-width="0.8"/>
      <text x="8" y="105" font-family="system-ui, sans-serif" font-size="8" fill="#10233F" font-weight="600">Audit Dossier &amp; Provenance Log</text>
    </g>
  </g>

  <!-- Bottom Details -->
  <line x1="45" y1="275" x2="835" y2="275" stroke="#D4D9E2" stroke-width="0.8"/>
  <text x="45" y="288" font-family="monospace" font-size="7" fill="#657187">SYSTEMS ENGINEERING // INTEGRATION PATTERNS ACROSS PRODUCTION &amp; RESEARCH REPOSITORIES</text>
  <text x="835" y="288" font-family="monospace" font-size="7" fill="#657187" text-anchor="end">SYS.REF: ARCH-MAP-2026</text>
</svg>