    <rect x="0" y="0" width="180" height="3" fill="#10233F"/>
    <text x="12" y="18" font-family="monospace" font-size="7" fill="#657187">TIER 03</text>
    <text x="12" y="32" font-family="system-ui, sans-serif" font-size="11" fill="#10233F" font-weight="700">COMPUTE &amp; REASONING</text>
    <line x1="12" y1="38" x2="168" y2="38" stroke="#D4D9E2" stroke-width="0.6"/>

    <g transform="translate(12, 48)">
