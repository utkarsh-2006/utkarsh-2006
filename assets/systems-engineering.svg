      <rect x="0" y="30" width="156" height="24" fill="#FAF9F6" stroke="#D4D9E2" stroke-width="0.8"/>
      <text x="8" y="45" font-family="system-ui, sans-serif" font-size="8" fill="#10233F" font-weight="600">NumPy / SciPy Solvers</text>

      <rect x="0" y="60" width="156" height="24" fill="#FAF9F6" stroke="#D4D9E2" stroke-width="0.8"/>
      <text x="8" y="75" font-family="system-ui, sans-serif" font-size="8" fill="#10233F" font-weight="600">Docling Parser &amp; OCR Engine</text>

      <rect x="0" y="90" width="156" height="24" fill="#FAF9F6" stroke="#D4D9E2" stroke-width="0.8"/>
      <text x="8" y="105" font-family="system-ui, sans-serif" font-size="8" fill="#10233F" font-weight="600">Deterministic State Machines</text>
    </g>
  </g>

  <!-- Connection Arrows Tier 3 -> Tier 4 -->
  <g transform="translate(630, 150)">
    <line x1="0" y1="0" x2="15" y2="0" stroke="#306FE5" stroke-width="1.2"/>
    <polygon points="15,0 10,-3 10,3" fill="#306FE5"/>
    <text x="7.5" y="-6" font-family="monospace" font-size="6" fill="#306FE5" text-anchor="middle">SYNC</text>
